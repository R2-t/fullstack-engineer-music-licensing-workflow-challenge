services:
  db:
    image: postgres:16-alpine
    container_name: licensing-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: licensing_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    container_name: licensing-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/licensing_db
      PORT: 8080
      JWT_SECRET: secret_key_change_me
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
